name: Build Midnight

on:
  push:
    branches: [iOS]
  pull_request:
    branches: [iOS]

jobs:
  build-midnight:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p build

      - name: Compile dylib
        run: |
          clang++ -dynamiclib \
            -std=c++17 \
            -x objective-c++ \
            -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -I includes \
            main.cpp src/protocol.cpp \
            -o build/libmidnight.dylib \
            -framework Foundation

      - name: List output
        run: ls -lh build/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: Midnight-dylib
          path: build/libmidnight.dylib
